# Next.js on Netlify via @netlify/plugin-nextjs (the "Next.js Runtime").
# Declaring [[plugins]] explicitly is required: once a netlify.toml with a
# [build] block exists, Netlify stops auto-injecting the framework's build
# plugin on its own — confirmed from a real build log on this site (no
# "Loading plugins" step at all without this, publish path ended up empty,
# zero functions generated, every route 404'd).
#
# `publish = ".next"` is required too: with no publish set, it defaults to
# the base directory itself, which the plugin explicitly refuses ("Your
# publish directory cannot be the same as the base directory") — confirmed
# from a second real build log. With the plugin actually registered (unlike
# the earlier, plugin-less attempt where `.next` alone did nothing), it
# intercepts this directory in its own build hooks and generates the real
# Functions/Edge Functions from it.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
